name: Bug or compatibility report
description: Report a reproducible problem with SkiFreeWebOS.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Please do not upload ski32.exe, original game files, device credentials or private network details.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: TV model and exact webOS / firmware release
    validations:
      required: true
  - type: dropdown
    id: input
    attributes:
      label: Input device
      options:
        - Magic Remote pointer
        - Remote directional keys
        - USB / Bluetooth mouse
        - USB / Bluetooth keyboard
        - Gamepad
        - No input involved
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected result and actual result
      description: Include the selected run (Original, Recreation or Yeti Chase), the controls used and whether the problem repeats after reopening.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant sanitized error text
      description: Remove credentials, private addresses and unrelated logs. Do not upload original game files.
